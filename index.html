<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tus gastos, ingresos y ahorro. Los datos se guardan solo en tu dispositivo." />

    <!-- Installed on the iPhone home screen: full screen, own name and icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Balance" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // With "default", iOS paints the status bar of the installed app white. In dark mode, make it
      // translucent instead: the app's black background shows through and the clock turns white.
      // iOS reads this when the app starts, so it follows the mode the app was opened in.
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          .setAttribute('content', 'black-translucent');
        document.documentElement.dataset.statusBar = 'translucent';
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Balance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
